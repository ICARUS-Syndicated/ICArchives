image: node:24

stages:
  - test
  - deploy

test:
  stage: test
  script:
  - npm ci
  - npm run build
  rules:
    - if: $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  script:
  - npm ci
  - npm run build
  - mv ./build ./public
  artifacts:
    paths:
    - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
